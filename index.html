<style>
:root{--bg:#2e3440;--s1:#3b4252;--s2:#434c5e;--ln:#4c566a;--tx:#eceff4;--mu:#aab4c8;--ac:#bf616a;--acb:#a8444f;--ok:#a3be8c;--fr:#88c0d0;--on:#2e3440;color-scheme:dark;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);-webkit-text-size-adjust:100%}
@media(prefers-color-scheme:light){:root{--bg:#eceff4;--s1:#e5e9f0;--s2:#d8dee9;--ln:#c4cbd9;--tx:#2e3440;--mu:#4c566a;--ok:#4f7a3a;--fr:#2f6f82;--on:#fff;color-scheme:light}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:20px 18px 40px}
h1{font-size:30px;line-height:1.15;margin:8px 0 6px;font-weight:600;letter-spacing:-.02em}
.sub{color:var(--mu);margin:0 0 18px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:0 18px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);background:none;color:var(--tx);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px}
.chip[aria-pressed=true]{background:var(--fr);border-color:var(--fr);color:var(--on);font-weight:500}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:600;background:var(--s2);color:var(--tx);margin-top:10px}
.btn.p{background:var(--acb);color:#fff}
.btn.g{background:var(--ok);color:var(--on)}
.btn.q{background:none;color:var(--mu);font-weight:400;font-size:14px}
.row{display:flex;gap:10px}.row .btn{flex:1}
.stat{color:var(--mu);font-size:14px;margin:18px 0 0}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--s1);border:0;color:var(--tx);border-radius:12px;padding:14px;margin-top:8px;font:inherit}
.item b{font-weight:500;display:block}.item small{color:var(--mu)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ln);flex:none}
.dot.y{background:var(--ok);border-color:var(--ok)}.dot.n{background:var(--ac);border-color:var(--ac)}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--mu)}
.bar button{background:none;border:0;color:var(--fr);font:inherit;padding:6px 0}
.alert{background:var(--s1);border-left:4px solid var(--ac);border-radius:4px 12px 12px 4px;padding:16px;margin:14px 0}
.tag{display:inline-block;font-size:13px;color:var(--mu);margin-right:12px}
.alert h2{font-size:21px;line-height:1.25;margin:8px 0}
.alert p{margin:6px 0}
.hint{color:var(--fr);margin:12px 0}
h3{font-size:17px;margin:22px 0 4px}
ol{padding-left:22px;margin:6px 0}li{margin:8px 0}
pre{background:#242933;color:#d8dee9;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:14px;border-radius:10px;overflow-x:auto;margin:12px 0;tab-size:2}
#sq{width:100%;background:var(--s1);border:1px solid var(--ln);color:var(--tx);border-radius:12px;padding:13px 14px;font:inherit;margin:0 0 14px}
#sq:focus{outline:2px solid var(--fr);outline-offset:1px}
.btn:disabled{opacity:.5}
.ex{margin:-4px 0 16px;color:var(--mu);font-size:14px;line-height:1.5}
.take{border-top:1px solid var(--ln);padding-top:12px;margin-top:16px;color:var(--mu)}
.score{font-size:52px;font-weight:600;margin:12px 0 0}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex="-1"]:focus-visible{outline:2px solid var(--fr);outline-offset:2px}
[tabindex="-1"]:focus:not(:focus-visible){outline:0}
</style>
