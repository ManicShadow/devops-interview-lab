<script>

const T=["Linux","Kubernetes","Helm","ArgoCD","Terraform","Ansible","Docker","CI/CD","GitLab","Jenkins","Monitoring","Mesh","SRE","AWS","Cloud","Networking","Security","Design","Behavioural"];
const S=[
["Linux","Mid","Disk is “full” but df shows free space","Deploys fail with “No space left on device”, yet df -h shows /var at 40%. What do you check?","Space has two currencies. One of them isn’t bytes.",
["Run df -i. If inode use is 100%, millions of tiny files (sessions, mail queue, cache) are the cause.","Find the directory holding them by counting files per folder.","Also look for deleted-but-open files: a process still holds a log someone rm’d, so the space is never released.","Clean up, then fix the source: log rotation, cache TTL or a leaking process."],
["df -h /var && df -i /var","for d in /var/*; do echo $d $(find $d -xdev | wc -l); done","lsof +L1 | grep /var","truncate -s 0 /proc/<pid>/fd/<fd>"],
"Check inodes and open-deleted files before blaming capacity."],
["Linux","Senior","Load average 30, CPU 90% idle","A host shows load average 30 on 8 cores, yet top says the CPU is mostly idle and the app is slow.","Load counts waiting tasks, not only running ones.",
["Linux load includes tasks in uninterruptible sleep (D state), usually blocked on disk or NFS.","vmstat 1: high b and wa columns confirm I/O wait.","iostat -x shows which device has high await and %util.","pidstat -d or iotop names the process. Check for a hung NFS mount or failing disk in dmesg.","Mitigate: stop the noisy writer, fix the mount or move the workload."],
["uptime","vmstat 1 5","iostat -xz 1","ps -eo state,pid,cmd | grep '^D'","dmesg -T | tail"],
"High load with idle CPU almost always means blocked on I/O."],
["Kubernetes","Mid","Pod is in CrashLoopBackOff","After a deploy, a pod restarts every few seconds with CrashLoopBackOff. Walk me through it.","The previous container holds the evidence.",
["kubectl describe pod: read Last State, Exit Code and Events.","Exit 137 / OOMKilled: raise the memory limit or fix the leak. Exit 1: application error, read the logs.","kubectl logs --previous shows the crashed container’s output, not the fresh one.","Check config: missing ConfigMap or Secret key, wrong env var, bad command or args.","Liveness probe too aggressive? Add a startupProbe or raise initialDelaySeconds."],
["kubectl describe pod <pod>","kubectl logs <pod> --previous","kubectl get events --sort-by=.lastTimestamp","kubectl get pod <pod> -o jsonpath='{.status.containerStatuses[0].lastState}'"],
"Exit code plus previous logs solve most crash loops in two commands."],
["Kubernetes","Mid","Service refuses connections","A Service exists and pods are Running, but clients get connection refused.","Follow the path: Service, Endpoints, Pod.",
["kubectl get endpoints <svc>. Empty means the selector matches no Ready pods.","Compare the Service selector with the pod labels.","Check targetPort matches the port the app really listens on.","Pods not Ready? A failing readiness probe removes them from endpoints.","Test from inside the cluster with a debug pod, then check NetworkPolicy and Ingress."],
["kubectl get svc,endpoints <svc>","kubectl get pods --show-labels","kubectl run dbg --rm -it --image=nicolaka/netshoot -- curl -v <svc>:80","kubectl get networkpolicy"],
"Empty endpoints point to labels or readiness, not the network."],
["Kubernetes","Mid","New pods stay Pending","After a release, three pods never leave Pending. Why?","The scheduler writes down exactly why it said no.",
["kubectl describe pod and read the FailedScheduling event.","Insufficient cpu or memory: requests too large or cluster full. Add nodes or tune requests.","Taints without tolerations, or nodeSelector and affinity that match nothing.","PVC Pending: no matching StorageClass, or a volume in a different zone.","ResourceQuota or LimitRange can also block creation."],
["kubectl describe pod <pod> | grep -A5 Events","kubectl describe node <node> | grep -A8 Allocated","kubectl get pvc","kubectl get resourcequota -A"],
"Pending is a scheduling problem. The event message names the cause."],
["Helm","Mid","Upgrade fails: another operation in progress","helm upgrade returns “another operation (install/upgrade/rollback) is in progress” after a CI job was killed.","Look at the release history.",
["helm history: the release is stuck in pending-upgrade.","Roll back to the last good revision.","If rollback is also blocked, delete the Secret of the pending revision. This is a last resort.","Prevent it: --atomic with --timeout, and one CI job per release at a time."],
["helm history <rel> -n <ns>","helm rollback <rel> <rev> -n <ns>","kubectl get secret -n <ns> -l owner=helm,status=pending-upgrade","helm upgrade --install <rel> ./chart --atomic --timeout 5m"],
"Helm keeps release state in Secrets, so a killed job can leave a stale lock."],
["Helm","Senior","One chart, three environments, safe secrets","Deploy the same chart to dev, staging and prod with different settings. Where do secrets go?","Layer values, keep secrets out of Git.",
["Base values.yaml holds safe defaults. One override file per environment, layered with -f (later wins).","Secrets never live in plain values: use External Secrets Operator, Sealed Secrets or SOPS.","Review before applying with helm template and helm diff.","Add values.schema.json so typos fail fast. Use --atomic for prod."],
["helm upgrade --install app ./chart -f values.yaml -f values-prod.yaml -n prod --atomic","helm template app ./chart -f values-prod.yaml | kubeconform -","helm diff upgrade app ./chart -f values-prod.yaml"],
"Same chart everywhere, differences only in small override files."],
["ArgoCD","Mid","App is permanently OutOfSync","Nothing changed in Git, but the ArgoCD app flips to OutOfSync and keeps resyncing.","Something else is editing the live object.",
["argocd app diff shows the exact fields that differ.","Usually another controller mutates them: HPA changes replicas, a webhook injects a sidecar, defaults get added.","Ignore those fields with ignoreDifferences and enable RespectIgnoreDifferences.","If an HPA owns replicas, remove replicas from the manifest.","Check templates that render random values on every run."],
["argocd app diff <app>","spec:\n  ignoreDifferences:\n  - group: apps\n    kind: Deployment\n    jsonPointers: [/spec/replicas]\n  syncPolicy:\n    syncOptions: [RespectIgnoreDifferences=true]"],
"Drift is usually two controllers fighting. Decide who owns each field."],
["ArgoCD","Senior","Roll back a bad release the GitOps way","A bad version is live in prod and auto-sync is on. How do you roll back?","Git is the source of truth.",
["Normal path: git revert the bad commit or image-tag bump, push, let Argo sync.","Emergency path: argocd app rollback only works with auto-sync disabled, otherwise self-heal undoes it.","Disable auto-sync, roll back, fix Git, then re-enable auto-sync.","Prevent it: Argo Rollouts canary with analysis, and PreSync hooks for migrations."],
["git revert <sha> && git push","argocd app set <app> --sync-policy none","argocd app rollback <app> <id>","argocd app set <app> --sync-policy automated --self-heal"],
"A rollback that isn’t committed to Git will be undone by Argo."],
["Terraform","Mid","Error acquiring the state lock","terraform apply fails with a state lock error held by someone else.","Find out who holds it before touching it.",
["Read the lock info: ID, who, when, operation.","Confirm that no CI job or teammate is really applying. Never break a live lock.","If the run crashed, release it with force-unlock and the lock ID.","With an S3 backend the lock is a DynamoDB item, so you can inspect it there.","Prevent it: serialise pipelines per workspace."],
["terraform force-unlock <LOCK_ID>","aws dynamodb scan --table-name tf-locks"],
"A lock exists to prevent state corruption. Verify, then unlock."],
["Terraform","Mid","Adopt a hand-made resource","Someone created an S3 bucket in the console. Bring it under Terraform without recreating it.","Import it into state.",
["Write a resource block that matches the real bucket.","Import it with an import block (Terraform 1.5+) or terraform import.","Run plan until it says no changes.","Use plan -refresh-only to spot drift on existing resources, and moved blocks for refactors.","Restrict console writes with IAM or SCPs so it doesn’t recur."],
["import {\n  to = aws_s3_bucket.logs\n  id = \"my-logs-bucket\"\n}","terraform plan -generate-config-out=gen.tf","terraform plan -refresh-only"],
"Import adopts the object. Plan proves your code matches reality."],
["Ansible","Senior","Patch 500 servers without an outage","Patch 500 web servers behind a load balancer. How do you keep the site up?","Small batches, and stop on failure.",
["Rehearse on a canary group with --check --diff and --limit.","Use serial for rolling batches: 1, then 10%, then 25%.","Set max_fail_percentage so a bad change stops spreading.","Drain each host from the LB in pre_tasks, re-add after a health check in post_tasks.","Use real modules, not shell, so tasks stay idempotent."],
["ansible-playbook patch.yml --limit canary --check --diff","- hosts: web\n  serial: [1, \"10%\", \"25%\"]\n  max_fail_percentage: 10"],
"Rolling batches and a failure budget turn a risky change into a safe one."],
["Ansible","Mid","Slow playbook that always reports changes","A playbook takes 40 minutes and shows changed tasks on every run.","Two problems: idempotency and speed.",
["Changed every run means shell or command tasks. Use modules, or add changed_when and creates.","Find slow tasks with the profile_tasks callback.","Speed up: more forks, SSH pipelining, gather_facts off or gather_subset, strategy free, async for long tasks.","Verify: a second run must show changed=0."],
["[defaults]\nforks = 50\ncallbacks_enabled = profile_tasks\n[ssh_connection]\npipelining = True","ansible-playbook site.yml   # run twice"],
"If the second run changes anything, the playbook isn’t idempotent."],
["Docker","Mid","1.8 GB image and 12-minute builds","The CI image is huge and every build starts from scratch. Fix it.","Build in one stage, ship from another.",
["Multi-stage build: compile in a builder, copy only the artifact to a slim or distroless image.","Order layers so dependency files come before source code and the cache holds.","Add a .dockerignore (.git, node_modules).","Use BuildKit cache mounts and a registry cache in CI.","Run as non-root and scan with Trivy."],
["FROM golang:1.23 AS build\nWORKDIR /src\nCOPY go.* ./\nRUN go mod download\nCOPY . .\nRUN CGO_ENABLED=0 go build -o /app\n\nFROM gcr.io/distroless/static\nCOPY --from=build /app /app\nUSER nonroot\nENTRYPOINT [\"/app\"]","docker build --cache-from type=registry,ref=<repo>:cache ."],
"Smaller images and better layer order fix size and speed together."],
["Kubernetes","Junior","ImagePullBackOff from a private registry","A new deployment shows ErrImagePull, then ImagePullBackOff. The image exists in the registry.","The cluster needs credentials too.",["kubectl describe pod: the event shows the real error (unauthorized, not found, timeout).","Check the image name and tag for typos, and that the tag really exists.","Private registry: create a docker-registry Secret and reference it in imagePullSecrets, or attach it to the ServiceAccount.","On EKS/GKE/AKS, check the node role or workload identity has pull permission."],["kubectl describe pod <pod> | grep -A6 Events","kubectl create secret docker-registry regcred --docker-server=<host> --docker-username=<u> --docker-password=<p> -n <ns>","kubectl patch sa default -n <ns> -p '{\"imagePullSecrets\":[{\"name\":\"regcred\"}]}'"],"The Events line tells you whether it is auth, naming or network."],
["Kubernetes","Senior","A node goes NotReady","One worker node flips to NotReady and its pods are being evicted.","Start from the kubelet, not the pods.",["kubectl describe node: read Conditions (DiskPressure, MemoryPressure, PIDPressure, Ready).","SSH to the node: check kubelet and container runtime status and logs.","Common causes: disk full from images or logs, runtime crash, lost network to the API server, clock skew or expired certs.","Cordon the node, drain it gracefully, fix or replace it, then uncordon.","With autoscaling, simply terminate the bad node and let a fresh one join."],["kubectl describe node <node> | grep -A10 Conditions","systemctl status kubelet containerd","journalctl -u kubelet --since '15 min ago'","kubectl drain <node> --ignore-daemonsets --delete-emptydir-data"],"Nodes are cattle: diagnose briefly, then replace."],
["Kubernetes","Senior","Requests fail during every rollout","Each deployment causes a burst of 502s for a few seconds, even with 3 replicas.","Traffic is still sent to pods that are shutting down.",["On termination, endpoint removal and SIGTERM race each other, so the pod can get requests after it starts shutting down.","Add a preStop sleep (5 to 10 s) so the endpoint is removed first, and handle SIGTERM gracefully.","Set terminationGracePeriodSeconds longer than the preStop plus drain time.","A readinessProbe must only pass when the app can really serve.","Use maxUnavailable: 0 and a PodDisruptionBudget."],["lifecycle:\n  preStop:\n    exec:\n      command: [\"sleep\", \"8\"]","strategy:\n  rollingUpdate:\n    maxUnavailable: 0\n    maxSurge: 1"],"Zero downtime needs readiness, preStop and graceful shutdown together."],
["Kubernetes","Mid","HPA shows <unknown> and never scales","Load rises, but the HorizontalPodAutoscaler stays at the minimum and shows <unknown>/70% CPU.","HPA needs a metric source and a denominator.",["kubectl describe hpa: look for FailedGetResourceMetric.","Is metrics-server installed and healthy? kubectl top pods must work.","Utilisation is a percentage of requests, so containers without resources.requests give no value.","Check min/max replicas and that the target kind and name are correct.","For non-CPU signals use custom metrics (Prometheus adapter) or KEDA."],["kubectl describe hpa <name>","kubectl top pods -n <ns>","kubectl get apiservice v1beta1.metrics.k8s.io"],"No CPU requests means no CPU-based autoscaling."],
["Terraform","Senior","Plan wants to destroy and recreate the database","After a refactor, terraform plan shows aws_db_instance must be replaced. Do you apply?","Never apply a replace on stateful resources without understanding it.",["Read the plan: the line marked “forces replacement” names the attribute.","If you only renamed or moved the resource, use a moved block so state follows the code.","If an argument change forces it, check whether it can be changed in place or ignored.","Protect data resources with lifecycle prevent_destroy and take a snapshot first.","Apply only after review in CI with a saved plan."],["terraform plan -out=tfplan && terraform show tfplan","moved {\n  from = aws_db_instance.db\n  to   = module.data.aws_db_instance.db\n}","lifecycle {\n  prevent_destroy = true\n}"],"Always find the attribute that forces replacement."],
["Terraform","Senior","Structure state for many teams","One giant state file makes plans slow and risky. How do you split it?","Blast radius and ownership.",["Split state by lifecycle and owner: network, shared platform, each app or environment.","Use a remote backend with locking and per-state access control.","Share values through outputs and remote state or data sources, not copy-paste.","Put reusable logic in versioned modules, and use separate directories per environment rather than relying only on workspaces.","Run plan and apply in CI, with policy checks."],["terraform {\n  backend \"s3\" {\n    bucket = \"tf-state\"\n    key    = \"prod/network.tfstate\"\n    use_lockfile = true\n  }\n}"],"Small states mean fast plans and small blast radius."],
["CI/CD","Mid","Slow, flaky GitHub Actions pipeline","The pipeline takes 25 minutes and sometimes fails on tests that pass on rerun.","Cache, parallelise, and isolate.",["Cache dependencies and build output with actions/cache or the setup action’s cache option.","Split independent jobs and use a matrix to run test shards in parallel.","Cancel superseded runs with a concurrency group.","Flaky tests: find them, quarantine them, and fix shared state or timing. Don’t just add retries.","Use larger or self-hosted runners only after the above."],["concurrency:\n  group: ci-${{ github.ref }}\n  cancel-in-progress: true","strategy:\n  matrix:\n    shard: [1, 2, 3, 4]"],"Retries hide flakiness. Caching and parallelism fix speed."],
["CI/CD","Senior","Deploy to AWS without stored keys","Your pipeline uses long-lived AWS access keys saved as secrets. Improve it.","Short-lived identity beats stored secrets.",["Use OIDC federation: the CI provider issues a signed token and AWS exchanges it for temporary credentials.","Create an IAM role whose trust policy limits the repo, branch or environment.","Give the role least privilege, one per environment.","In the workflow, request id-token: write and assume the role.","Delete the old access keys."],["permissions:\n  id-token: write\n  contents: read","- uses: aws-actions/configure-aws-credentials@v4\n  with:\n    role-to-assume: arn:aws:iam::<acct>:role/ci-deploy\n    aws-region: eu-central-1"],"No stored keys means nothing to leak or rotate."],
["Monitoring","Mid","Prometheus alert is noisy and flapping","A CPU alert pages the team 15 times a night and resolves itself each time.","Alert on symptoms that need a human.",["Add a for: duration so short spikes don’t fire.","Use rate() over a window of at least four times the scrape interval.","Alert on user impact (error rate, latency, saturation) rather than raw CPU.","Group and inhibit in Alertmanager so one outage sends one page.","Every page needs a runbook link, or it should not be a page."],["alert: HighErrorRate\nexpr: sum(rate(http_requests_total{code=~\"5..\"}[5m])) / sum(rate(http_requests_total[5m])) > 0.05\nfor: 10m\nlabels: {severity: page}"],"A page must be urgent, actionable and tied to user impact."],
["Monitoring","Senior","Latency doubled since this morning","Users report slowness. Dashboards show p99 latency doubled. How do you find the cause?","Narrow by time, then by component.",["Line up the start of the spike with deploys, config changes and traffic changes.","RED for services (rate, errors, duration) and USE for resources (utilisation, saturation, errors).","Break latency down by endpoint, version, pod and dependency to localise it.","Use traces to see which hop is slow: database, cache or an external API.","Mitigate first (roll back, scale, shed load), then write the postmortem."],["histogram_quantile(0.99, sum by (le, route) (rate(http_request_duration_seconds_bucket[5m])))","kubectl rollout undo deployment/<name>"],"Mitigate first, find the root cause second."],
["AWS","Mid","Private instance can’t reach the internet","An EC2 instance in a private subnet can’t reach package repos or external APIs.","Follow the packet out.",["The private subnet’s route table needs 0.0.0.0/0 pointing to a NAT gateway.","The NAT gateway must sit in a public subnet whose route table points to an internet gateway, and it needs an Elastic IP.","Check the security group egress rules and the NACL, which is stateless and needs both directions.","For AWS services only, a VPC endpoint avoids NAT cost.","Use Reachability Analyzer to confirm."],["aws ec2 describe-route-tables --filters Name=association.subnet-id,Values=<subnet>","aws ec2 describe-nat-gateways","curl -sv --max-time 5 https://example.com"],"Routes, NAT, then SG and NACL, in that order."],
["Networking","Senior","Intermittent DNS failures in pods","Pods randomly fail with “temporary failure in name resolution”, about 1 request in 50.","Look at CoreDNS and how the pod resolves.",["Check CoreDNS pods for restarts, CPU throttling and logs.","Default ndots:5 turns one lookup into several; use FQDNs with a trailing dot or lower ndots.","Run dig from a debug pod against the cluster DNS IP and against upstream.","Conntrack races on UDP can drop packets, so consider NodeLocal DNSCache.","Scale CoreDNS and set proper requests and limits."],["kubectl -n kube-system logs -l k8s-app=kube-dns --tail=50","kubectl run dbg --rm -it --image=nicolaka/netshoot -- dig +search api.default.svc","cat /etc/resolv.conf"],"Most DNS flakiness is ndots amplification or an overloaded CoreDNS."],
["Security","Senior","A secret was pushed to Git","A developer committed an AWS access key to a public repo 10 minutes ago.","Rotate first, clean up second.",["Revoke and rotate the credential immediately. Assume it is already stolen.","Check CloudTrail or audit logs for use of the key since the commit.","Remove it from history (git filter-repo or BFG) and force-push, but deletion alone doesn’t help.","Add prevention: secret scanning and push protection, pre-commit hooks.","Move to short-lived credentials and a secrets manager. Write a short postmortem."],["aws iam update-access-key --access-key-id <id> --status Inactive","aws cloudtrail lookup-events --lookup-attributes AttributeKey=AccessKeyId,AttributeValue=<id>","git filter-repo --path-glob '*.env' --invert-paths"],"Once a secret is public, only rotation fixes it."],
["Jenkins","Mid","Builds queue forever with idle agents","Jobs sit in the queue on “waiting for next available executor”, though the team has plenty of agents.","Check that agents are connected and labelled correctly.",["Manage Jenkins, Nodes: are agents offline or disconnected?","Label mismatch: the Jenkinsfile asks for a label no agent has.","Executors may be held by hung builds, so add timeouts.","Dynamic agents (Kubernetes plugin): check the pod template, quotas and cloud config logs.","Keep builds off the controller so it never runs out of disk or memory."],["agent { label 'linux-docker' }","options { timeout(time: 30, unit: 'MINUTES') }","kubectl get pods -n jenkins-agents"],"Queue problems are almost always labels, offline agents or hung builds."],
["Jenkins","Mid","Secrets appear in the console log","A build prints an API token in plain text in the console output.","Let Jenkins mask it, and don’t interpolate it yourself.",["Store secrets in Jenkins Credentials, never in the Jenkinsfile or job config.","Use withCredentials so values are masked in logs.","Use single-quoted shell strings so the shell reads the variable, not Groovy.","Never run set -x or echo around secrets.","Rotate anything that leaked, and prefer short-lived credentials (Vault, OIDC)."],["withCredentials([string(credentialsId: 'api-token', variable: 'TOKEN')]) {\n  sh 'curl -H \"Authorization: Bearer $TOKEN\" https://api.example.com'\n}"],"Masking is a safety net. Don’t print secrets in the first place."],
["Jenkins","Senior","Modernise a hand-configured Jenkins","Your Jenkins server was set up by clicking. Nobody dares to touch or rebuild it.","Make it reproducible from Git.",["Pipelines as code: a Jenkinsfile in every repo.","Configuration as code (JCasC) plus a pinned plugin list.","Ephemeral agents on Kubernetes or cloud, one clean pod per build.","Shared libraries for common stages, so teams stop copy-pasting.","Back up JENKINS_HOME and test a full rebuild. Ask whether GitHub Actions or GitLab CI would be simpler."],["jenkins:\n  systemMessage: \"Managed by code\"\n  numExecutors: 0","jenkins-plugin-cli --plugin-file plugins.txt"],"If you can’t rebuild Jenkins from Git, it’s a pet."],
["CI/CD","Mid","SonarQube quality gate blocks every merge","The gate fails on a legacy codebase and the team starts bypassing it.","Judge new code, not history.",["Use Clean as You Code: the gate applies to new and changed code only.","Set the new code period to a reference branch or the previous version.","Fix issues on changed lines. Mark real false positives with a reason.","Don’t lower thresholds globally just to get green.","Make the pipeline wait for the gate result and fail on it."],["sonar-scanner -Dsonar.projectKey=app -Dsonar.qualitygate.wait=true","sonar.newCode.referenceBranch=main"],"A gate on new code improves quality without blocking on old debt."],
["Monitoring","Mid","Grafana panel says No data","A dashboard that worked yesterday shows No data on every panel.","Work from the data source backwards.",["Check the time range and dashboard variables first.","Open the panel in Explore and run the query directly.","Check the data source health and URL in settings.","In Prometheus, open Status, Targets: is the job up?","Did a metric or label get renamed? Is the rate window shorter than the scrape interval?"],["up{job=\"api\"}","rate(http_requests_total[5m])","curl -s localhost:9090/api/v1/targets | head"],"No data usually means the query, the labels or the scrape broke."],
["Monitoring","Senior","Prometheus keeps running out of memory","Prometheus is OOM-killed every few days and memory keeps growing.","Memory follows the number of active series.",["Find the heavy metrics by counting series per metric name.","The usual cause is a high-cardinality label: user ID, full URL path or a pod hash.","Drop or rewrite those labels with metric_relabel_configs.","Pre-aggregate expensive queries with recording rules.","Shorten retention, shard, or send long-term data to Thanos or Mimir."],["topk(10, count by (__name__) ({__name__=~\".+\"}))","metric_relabel_configs:\n- action: labeldrop\n  regex: user_id"],"Every unique label combination costs memory, so keep labels bounded."],
["Cloud","Mid","AKS can’t pull from Azure Container Registry","Pods on AKS show ImagePullBackOff with 401 Unauthorized from your ACR.","The kubelet identity needs the AcrPull role.",["kubectl describe pod confirms the 401.","Attach the registry to the cluster, which grants AcrPull to the kubelet managed identity.","Check the image uses the full login server name.","Private registry: verify network rules or private endpoint DNS.","Run the built-in ACR check to confirm."],["az aks update -n <cluster> -g <rg> --attach-acr <acr>","az aks check-acr -n <cluster> -g <rg> --acr <acr>.azurecr.io"],"Prefer managed identity roles over image pull secrets."],
["Cloud","Mid","GKE pod gets 403 from Cloud Storage","A pod can’t read a bucket and returns 403, though the bucket exists.","Give the pod its own identity.",["By default pods inherit the node’s service account, which is broad or wrong.","Use Workload Identity: bind a Kubernetes ServiceAccount to a Google service account.","Grant roles/iam.workloadIdentityUser on the Google service account to the KSA.","Give the Google service account only the bucket role it needs.","Verify from inside the pod."],["gcloud iam service-accounts add-iam-policy-binding <gsa> --role roles/iam.workloadIdentityUser --member \"serviceAccount:<proj>.svc.id.goog[<ns>/<ksa>]\"","kubectl annotate sa <ksa> -n <ns> iam.gke.io/gcp-service-account=<gsa>"],"One identity per workload, with least privilege."],
["Cloud","Senior","The cloud bill jumped 40%","Finance says last month’s cloud cost rose 40%. Find out why.","Locate the change, then the cause.",["Group cost by service, account, region and tag to see where it moved.","Compare day by day to find the start date, then match it to a deploy or change.","Common culprits: NAT and cross-AZ data transfer, oversized or idle instances, unattached volumes, log ingestion, forgotten test environments.","Fix: rightsize, switch off non-prod at night, add storage lifecycle rules, use Savings Plans for steady load.","Add budgets, anomaly alerts and mandatory cost tags."],["aws ce get-cost-and-usage --time-period Start=2026-10-01,End=2026-11-01 --granularity DAILY --metrics UnblendedCost --group-by Type=DIMENSION,Key=SERVICE"],"Tags and budgets make the next spike obvious within a day."],
["Linux","Mid","Service won’t start after a reboot","A systemd service worked before and now shows failed after the server restarts.","systemd keeps the story in the journal.",["systemctl status shows the state and the last log lines.","journalctl -u for this boot shows the full failure.","Common causes: wrong ExecStart path or permissions, missing ordering (After=network-online.target), a mount not ready, a port already in use.","After editing a unit file, run daemon-reload.","Validate the unit with systemd-analyze verify."],["systemctl status myapp","journalctl -u myapp -b --no-pager","systemd-analyze verify /etc/systemd/system/myapp.service","systemctl daemon-reload && systemctl restart myapp"],"Boot-time failures are usually ordering or dependencies."],
["Linux","Senior","A process keeps getting OOM-killed","A critical service dies at random and the host has plenty of RAM on paper.","The kernel log names the victim.",["Confirm in dmesg: look for “Out of memory” and “Killed process”.","Check free memory and the top consumers, ideally over time.","In containers the kill may come from the cgroup limit, not the host.","Leak (steady growth) or spike (batch job, load)? The fix differs.","Fix the leak or raise the limit, protect critical services with oom_score_adj, and alert on memory growth."],["dmesg -T | grep -i 'killed process'","free -m && ps aux --sort=-%mem | head","cat /sys/fs/cgroup/memory.max"],"Find out which limit was hit before changing any number."],
["Linux","Junior","SSH says Permission denied (publickey)","You can’t log in to a new server. The key worked on other machines.","Verbose output shows which keys are tried.",["Run ssh with -vvv and see which keys are offered and why they fail.","Permissions: ~/.ssh must be 700 and authorized_keys 600, and the home directory must not be group-writable.","Check you are using the right user and that the public key is in authorized_keys.","On the server read the sshd log, check sshd_config (PubkeyAuthentication, AllowUsers) and the SELinux context."],["ssh -vvv user@host","chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys","restorecon -R ~/.ssh","journalctl -u sshd | tail"],"Wrong file permissions are the most common cause."],
["Design","Senior","Design a CI/CD pipeline for microservices","You have 40 services and one team asks for a standard pipeline. What does it look like?","Build once, promote everywhere.",["Trunk-based development with short-lived branches and PR checks: lint, unit tests, SAST.","Build one immutable image per commit, tagged by SHA. Promote that same artifact, never rebuild.","Scan and sign images and publish an SBOM.","Deploy with GitOps: the pipeline bumps the tag in the environment repo and Argo CD syncs.","Progressive delivery (canary with automated analysis) and a simple rollback.","Track DORA metrics and put deploy markers on dashboards."],["PR:   lint, test, scan\nmain: build, push :<sha>, sign\nenv repo: bump tag, Argo CD sync\nprod: canary 10%, analysis, full rollout"],"Same artifact in every environment, with Git as the record of what runs."],
["Design","Senior","Design multi-region high availability","A service must survive the loss of a whole region. How do you design it?","Start with RTO and RPO, not technology.",["Ask the business for the recovery time (RTO) and data loss (RPO) per service.","Pick a pattern to match: backup and restore, pilot light, warm standby or active-active.","Traffic: health-checked DNS or a global load balancer.","Data is the hard part: choose async replication or multi-primary and accept the consistency trade-offs.","Keep both regions identical with IaC, and run regular failover game days."],["Pattern         RTO        Cost\nbackup/restore  hours      low\npilot light     ~1 hour    low-mid\nwarm standby    minutes    mid\nactive-active   near zero  high"],"An untested failover plan is a hope, not a design."],
["Terraform","Mid","Plan breaks after a provider upgrade","A teammate’s PR merged fine, but on your machine terraform plan now fails with unsupported argument errors.","Compare provider versions across machines and CI.",["Run terraform version and terraform providers to see which provider versions are in use.","Commit .terraform.lock.hcl so everyone and CI use the same provider build.","Pin versions in required_providers with a ~> constraint.","Upgrade on purpose: init -upgrade, read the changelog, plan in a branch.","To roll back, revert the constraint and the lock file, then init again."],["terraform version && terraform providers","terraform init -upgrade","required_providers {\n  aws = {\n    source  = \"hashicorp/aws\"\n    version = \"~> 5.70\"\n  }\n}"],"Lock file plus version pins make plans reproducible."],
["Terraform","Senior","Apply fails halfway through","terraform apply errors out after creating some resources. Half the stack exists.","State and reality may now disagree.",["Read the error first: quota, permission, dependency or API timeout.","List what state knows about, then run plan again. Terraform continues from state.","Resource exists in the cloud but not in state: import it.","Resource is broken or tainted: apply with -replace.","State corrupted: restore a previous version from the versioned backend bucket."],["terraform state list","terraform plan","terraform apply -replace=aws_instance.web","terraform import aws_instance.web i-0abc123","aws s3api list-object-versions --bucket tf-state --prefix prod/"],"Re-plan before anything else. A partial apply is usually resumable."],
["Terraform","Mid","Secrets show up in state and plan output","A review finds database passwords in plain text inside terraform.tfstate.","State is readable by anyone who can read the backend.",["Lock down the backend: encryption, versioning and tight IAM access.","Mark variables and outputs sensitive = true to hide them from CLI output.","Avoid creating secrets in Terraform when you can: read them from a secrets manager at runtime.","Search the state for exposed values, then rotate them."],["variable \"db_password\" {\n  type      = string\n  sensitive = true\n}","terraform show -json | grep -i password","aws s3api get-bucket-encryption --bucket tf-state"],"sensitive hides output only. The value is still in state."],
["Ansible","Mid","Vault can’t decrypt in CI","A playbook works locally but CI fails with “Attempting to decrypt but no vault secrets found”.","The pipeline has no vault password.",["Confirm the file really is encrypted: its first line starts with $ANSIBLE_VAULT.","Pass the password at runtime: write it from a CI secret to a temp file, or use ANSIBLE_VAULT_PASSWORD_FILE.","Several vaults need vault IDs.","Use no_log: true on tasks that handle secrets, and delete the temp file afterwards."],["head -1 group_vars/prod/vault.yml","echo \"$VAULT_PASS\" > .vp && chmod 600 .vp","ansible-playbook site.yml --vault-password-file .vp && rm .vp","ansible-vault encrypt_string 's3cret' --name db_password"],"Secrets are injected at run time and never stored in the repo."],
["Ansible","Mid","UNREACHABLE on some hosts","A run succeeds on 40 servers and reports UNREACHABLE on 6.","Isolate it from Ansible: test plain SSH.",["Run the ping module against the failing hosts with -vvv to see the SSH error.","Common causes: host key not in known_hosts, wrong user or key, firewall, host down, or a bastion that is required.","Reproduce with plain ssh using the same user, key and options.","Connects but fails later? Check become/sudo and that Python exists on the target.","Fix, then rerun with --limit on the failed hosts."],["ansible web -m ping -vvv","ansible-inventory --host <host>","ssh -o BatchMode=yes <user>@<host> true","ansible_ssh_common_args='-o ProxyJump=bastion'"],"If plain SSH fails, Ansible isn’t the problem."],
["Ansible","Senior","Refactor a 1000-line playbook into roles","One huge playbook is untestable and every change is risky. Restructure it.","Split by responsibility.",["Group tasks by function: common, nginx, app, monitoring.","One role per concern, with defaults for overridable settings and vars for constants.","Use handlers for restarts and tags for partial runs.","Lint with ansible-lint in CI and test each role with Molecule.","Share roles through collections or Git."],["ansible-galaxy init roles/nginx","roles/nginx/\n  defaults/main.yml\n  tasks/main.yml\n  handlers/main.yml\n  templates/nginx.conf.j2","ansible-lint","molecule test"],"Small roles with tests change safely."],
["CI/CD","Mid","GitHub Actions workflow doesn’t trigger","You pushed a change and no workflow run appears.","Check the trigger conditions first.",["The file must live in .github/workflows and be valid YAML.","Check the on: filters. A paths or branches filter may exclude your change.","Commits pushed with GITHUB_TOKEN do not trigger new workflows.","Look at the Actions tab for parse errors and make sure Actions is enabled.","Lint locally with actionlint."],["actionlint","gh workflow view ci.yml","gh run list --workflow ci.yml","on:\n  push:\n    branches: [main]\n    paths: ['src/**']"],"Most “no run” cases are filters or invalid YAML."],
["CI/CD","Mid","“Resource not accessible by integration”","A job fails when pushing an image or commenting on a PR.","The token lacks permissions.",["GITHUB_TOKEN permissions can be read-only by default.","Declare a permissions block, least privilege per job.","Pushing to GHCR needs packages: write. PR comments need pull-requests: write.","PRs from forks get a read-only token by design.","Check the repository or organisation default workflow permissions."],["permissions:\n  contents: read\n  packages: write","gh api repos/<owner>/<repo>/actions/permissions/workflow"],"Grant only the scopes each job needs."],
["GitLab","Mid","Job stuck: no active runner","A GitLab pipeline shows a job as pending with “stuck, no runners”.","Match the job to a runner.",["Job tags must match the tags of an online runner.","Is the runner online and not paused? Check Settings, CI/CD, Runners.","A runner limited to protected branches won’t run other refs.","On the runner host, check status, verify registration and read the service log.","Check concurrent in config.toml: the limit may be reached."],["gitlab-runner status","gitlab-runner verify","journalctl -u gitlab-runner -n 50","grep concurrent /etc/gitlab-runner/config.toml","job:\n  tags: [docker]"],"Pending jobs are nearly always tags, protection or capacity."],
["Mesh","Senior","Istio returns 503 upstream connect error","After enabling the mesh, service A gets 503 “upstream connect error” calling service B.","Check the sidecar, then mTLS.",["Are both pods 2/2 Ready, so the sidecar is injected?","istioctl proxy-status: are the proxies in sync with the control plane?","istioctl analyze finds misconfiguration in a namespace.","mTLS mismatch: PeerAuthentication STRICT with a client that has no sidecar.","Inspect the failing proxy’s clusters and read the istio-proxy log."],["istioctl proxy-status","istioctl analyze -n <ns>","kubectl get peerauthentication -A","istioctl proxy-config cluster <pod> -n <ns>","kubectl logs <pod> -c istio-proxy --tail=50"],"Most mesh 503s are mTLS mode or a missing sidecar."],
["Mesh","Mid","Canary traffic split isn’t applied","You set a 90/10 VirtualService, but all traffic still goes to v1.","Verify subsets, hosts and weights.",["DestinationRule subsets must use labels that real pods carry.","The VirtualService host must match the service name.","Weights must add up to 100.","Measure instead of guessing: send many requests and count versions.","Use istioctl analyze and proxy-config routes to see what the proxy loaded."],["http:\n- route:\n  - destination: {host: app, subset: v1}\n    weight: 90\n  - destination: {host: app, subset: v2}\n    weight: 10","for i in $(seq 100); do curl -s app/version; done | sort | uniq -c","istioctl proxy-config routes <pod>","kubectl get pods --show-labels"],"Labels and host names are the usual culprits."],
["SRE","Senior","Run a production incident","Checkout is failing for 30% of users and the pager is going off. What do you do?","Mitigate first, investigate second.",["Declare the incident, name an incident commander and a scribe.","Assess impact: who is affected and which SLO is burning.","Mitigate before diagnosing: roll back, fail over, scale, shed load or switch off a feature flag.","Communicate on a schedule to the status page and stakeholders.","Keep a timeline. Afterwards, hold a blameless postmortem with owners and dates."],["kubectl rollout history deployment/<name>","kubectl rollout undo deployment/<name>","kubectl get events -A --sort-by=.lastTimestamp | tail -20","14:02 alert | 14:06 declared | 14:15 rollback | 14:20 recovered"],"Recover users first. Understand the cause afterwards."],
["SRE","Senior","The error budget is nearly gone","Your 99.9% monthly SLO has used 80% of its budget in 10 days.","Budgets drive priorities.",["99.9% allows about 43 minutes of downtime per 30 days.","Alert on burn rate over both a short and a long window, so you catch fast and slow burns.","Find which incidents and endpoints consumed the budget.","Apply the policy: slow or freeze feature releases and prioritise reliability work.","Review whether the SLO matches what users really need."],["1 - (sum(rate(http_requests_total{code!~\"5..\"}[1h])) / sum(rate(http_requests_total[1h])))","# page when burn rate exceeds 14.4x of the 0.1% budget"],"An error budget turns reliability into a shared, measurable decision."],
["SRE","Mid","Database connections exhausted","The app logs “too many connections” and requests fail, but database CPU is low.","Count who holds the connections.",["Count connections by state in pg_stat_activity.","Look for idle in transaction sessions and leaking pools.","Compare max_connections with pool size times the number of replicas.","Short term: terminate stale sessions and restart the leaking app.","Long term: size pools correctly, add PgBouncer and set timeouts."],["psql -c \"select state, count(*) from pg_stat_activity group by 1;\"","psql -c \"show max_connections;\"","psql -c \"select pg_terminate_backend(pid) from pg_stat_activity where state='idle in transaction' and now()-state_change > interval '10 min';\""],"Total pool size across all replicas must fit under max_connections."],
["Behavioural","Senior","Tell me about a production outage you handled","The interviewer wants to see how you behave under pressure, not just what you fixed.","Use Situation, Task, Action, Result, and keep the focus on your decisions.",["Situation: the system, the impact and the time of day, in two sentences.","Task: your role. Were you on call, or the incident commander?","Action: how you triaged, what you mitigated first, who you told and what you chose not to do.","Result: time to recovery, customer impact and the numbers.","Learning: what changed afterwards (alert, runbook, test, automation)."],["Our checkout API started returning errors at 02:10 after a release. I was on call, so I declared an incident, rolled back within 12 minutes and posted updates to the status page every 15 minutes.","Afterwards I led a blameless postmortem. We added a canary stage and an error-rate alert, and the next bad release was caught at 5% traffic."],"Show calm mitigation first, then a concrete improvement."],
["Behavioural","Mid","Describe a disagreement with a teammate over a technical choice","For example: you wanted Terraform, they preferred scripts. How did you resolve it?","Show respect, evidence and commitment to the outcome.",["State the two positions fairly, including the strong points of theirs.","Say how you gathered evidence: a small proof of concept, a comparison, or numbers.","Explain how the decision was made and by whom.","Show that you committed fully to the outcome, even if it wasn’t yours.","Close with the relationship and what you learned."],["A colleague wanted to keep shell scripts for provisioning while I proposed Terraform. We agreed on a one-week proof of concept for one service and compared drift, review time and rollback.","Terraform won on all three, and I wrote the migration guide with him. We’re still on good terms and he now owns our module library."],"Disagree on facts, not people, and let evidence decide."],
["Behavioural","Mid","How do you handle being on call?","They ask how you cope with a 3 a.m. page and keep the rotation sustainable.","Talk about process, not heroics.",["Explain your first five minutes: acknowledge, check impact, open the runbook.","Describe how you escalate early and don’t sit on a problem alone.","Mention keeping the pager healthy: removing noisy alerts and automating fixes.","Say how you hand over and write short notes for the next shift.","Mention rest and compensation rules for the team."],["I acknowledge within minutes, check customer impact first and follow the runbook. If I’m not making progress in 20 minutes, I escalate.","Every page I get must lead to a fix, so after each week I remove or tune alerts that weren’t actionable. That cut our night pages by half."],"A healthy on-call culture is quiet pagers and early escalation."],
["Behavioural","Mid","Tell me about something you automated","The interviewer is looking for judgement and measurable impact.","Quantify the before and after.",["Describe the manual pain: how often, how long, how error-prone.","Say why you chose this task over others.","Explain what you built and how you tested it and rolled it out.","Give numbers: hours saved, errors removed.","Mention documentation and how others adopted it."],["Creating a new environment took two days of tickets. I wrote Terraform modules and a pipeline that builds one in 25 minutes from a pull request.","We create about eight environments a month, so it saves around 100 hours a month and removed configuration mistakes."],"Automation stories need a measured before and after."],
["Behavioural","Senior","How do you prioritise when everything is urgent?","Three teams ask for help at once and a production issue is open.","Use impact, urgency and communication.",["Production impact always comes first.","Rank the rest by users affected, business deadline and effort.","Say no or later clearly, with a date, and explain why.","Involve your manager when priorities truly conflict.","Keep a visible queue so people can see the order."],["I handle live customer impact first. Then I list the requests with impact and deadline, share the order openly and tell each team when to expect me.","If two requests tie, I ask my manager or the product owner to decide instead of guessing."],"Clear communication matters as much as the ranking."],
["Behavioural","Mid","Describe a mistake you made in production","They want honesty, ownership and what changed afterwards.","Own it. Don’t blame people or hide it.",["Pick a real mistake with real impact, not a disguised strength.","Say what happened plainly and how quickly you told others.","Explain how you fixed it.","Describe the safeguards you added: review, test, policy, automation.","Show a blameless attitude to your own and others’ mistakes."],["I once ran a Terraform apply against the wrong workspace and removed a staging load balancer. I told the team immediately and restored it within ten minutes.","I then added the workspace name to our prompt, required plans in CI and removed direct apply access from laptops."],"Good answers end with a system fix, not just a lesson."],
["Behavioural","Senior","Introduce a new tool to a sceptical team","You want to adopt ArgoCD, but the team likes the current deploy scripts.","Start with their pain, not the tool.",["Find out what hurts today and what they fear about the change.","Pilot on one low-risk service with clear success measures.","Show results and let the team run it.","Provide docs, a short training and a rollback plan.","Roll out gradually and listen for feedback."],["I asked the team what slowed deployments and the answer was drift and hard rollbacks. I piloted ArgoCD on one internal service and showed a rollback in under a minute.","After two weeks the team asked to move the next service themselves."],"People adopt tools that solve their problems."],
["Behavioural","Mid","Working with developers who resist security or process","Developers say the pipeline checks slow them down and want to skip them.","Treat it as a shared problem.",["Listen first: which checks hurt, and how much time do they cost?","Measure it, then fix slow or noisy checks.","Explain the risk in terms of their goals.","Make the safe path the easy path: templates, fast feedback.","Keep real guardrails for critical rules."],["Developers said our scanner added ten minutes. I moved it to run in parallel and only on changed images, and the delay dropped to two minutes.","Once the checks were fast, bypass requests stopped."],"Make the secure way the fast way."],
["Behavioural","Senior","Explain an outage to non-technical stakeholders","The CEO asks what happened and when it will be fixed.","Impact, status, next update. Skip the jargon.",["Lead with customer impact and current status.","Give an honest estimate, or say when you will update.","Avoid jargon and blame.","After recovery, share a short summary: cause, fix, prevention.","Keep updates on a fixed schedule."],["Customers can’t complete payments. We know the cause, a faulty release, and we are rolling it back. Next update in 15 minutes.","Afterwards I sent a half-page summary with the timeline and the three actions that prevent a repeat."],"Say what users feel, what you are doing and when you will update."],
["Behavioural","Mid","How did you reduce cost or improve reliability?","They want a result with numbers.","Baseline, change, outcome.",["State the baseline: cost, uptime or deploy time.","Explain how you found the biggest lever.","Describe the change and the risk you managed.","Report the result in numbers and the time frame.","Say how you made sure it lasted: budgets, alerts, SLOs."],["Our cloud bill was growing 8% a month. I found idle non-production clusters and oversized nodes, scheduled non-prod to switch off at night and rightsized the rest.","We saved about 30% in two months and added budget alerts to keep it there."],"Numbers and follow-through make a story credible."],
["Behavioural","Senior","A teammate keeps bypassing the review process","A colleague pushes hotfixes straight to production to move faster.","Understand the reason, then change the system.",["Talk to them privately first to understand why: pressure, slow reviews or tooling.","Explain the risk with a real example, not a lecture.","Fix the root cause: faster reviews, an emergency path with audit.","Enforce with branch protection so it isn’t personal.","Escalate only if the behaviour continues."],["I asked why they bypassed review and heard that reviews took a day. We set a four-hour review target and added a fast emergency path that is logged.","We also enabled branch protection so the rule is enforced by the system."],"Fix the incentive, then enforce it with tooling."],
["Linux","Mid","One process pins the CPU at 100%","A server is slow and monitoring shows one process using a full core.","Find out what it is doing before you kill it.",["Identify the process and the busy thread with top in thread mode or pidstat.","Is the time user, system or iowait? That changes the cause.","See what it is doing: a syscall summary with strace, or hot functions with perf.","Check recent changes: a deploy, a cron job, a runaway loop, or unwanted software such as a miner.","Mitigate with renice or a restart, but capture a thread dump or evidence first."],["top -H -o %CPU","pidstat -u 1 5","strace -c -p <pid>","perf top -p <pid>","renice +10 -p <pid>"],"Capture evidence before you kill a runaway process."],
["Linux","Mid","Permission denied although chmod looks right","A service can’t read a file, yet ls -l shows the right owner and mode.","Mode bits are only one layer.",["Check every directory in the path, not only the file: namei shows them all.","Check the user’s groups. A new group needs a new login or a service restart.","Look for ACLs with getfacl and for the immutable flag with lsattr.","Is the filesystem mounted read-only or noexec?","SELinux or AppArmor may be denying it. Check the audit log."],["namei -l /path/to/file","getfacl /path/to/file","lsattr /path/to/file","mount | grep /data","ausearch -m avc -ts recent"],"Permission denied is not always about mode bits."],
["Linux","Senior","The filesystem became read-only","Writes suddenly fail with “Read-only file system” on a production server.","The kernel remounts read-only to protect data after errors.",["dmesg usually shows I/O or filesystem errors just before the remount.","Check the disk health: SMART data, or the volume status in the cloud console.","Stop the services writing to it, then unmount and run fsck.","Remount read-write only after the repair.","If the disk is failing, restore to a new volume instead of repairing."],["dmesg -T | grep -iE 'error|read-only'","mount | grep ' ro,'","smartctl -a /dev/sda","fsck -fy /dev/sda1","mount -o remount,rw /"],"A read-only remount is a symptom. Find the underlying disk error."],
["Linux","Junior","Address already in use","A new deploy fails to start with “address already in use” on port 8080.","Find who owns the port.",["List listening sockets with the process that owns them.","Identify the process with lsof or fuser.","Is it a leftover process from a crashed deploy, or another service by design?","Check systemd socket activation, which can hold the port.","Stop the old process or change the port, then restart."],["ss -ltnp | grep :8080","lsof -i :8080","fuser -n tcp 8080","systemctl list-sockets"],"ss -ltnp answers who is listening in one line."],
["Linux","Junior","A cron job doesn’t run","A backup script works by hand but never runs from cron.","Cron runs with a minimal environment.",["Confirm the entry exists. Files in /etc/cron.d need a user field.","Check the cron log in the journal or syslog to see whether it was started.","Use absolute paths and set PATH, because cron’s environment is tiny.","The script needs a shebang, execute permission and a trailing newline in the crontab.","Redirect output to a log file so errors are visible."],["crontab -l","journalctl -u cron --since today","*/5 * * * * /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1","env -i /bin/sh -c '/usr/local/bin/backup.sh'"],"If it works in your shell but not in cron, it is the environment."],
["Linux","Mid","Logs keep filling the disk","/var fills up every few days, even though logrotate is installed.","Find the big files, then check the rotation.",["Find what is large with du sorted by size.","Run logrotate in debug mode to see what it would do and why it skips a file.","If the app keeps the old file open after rotation, use copytruncate or a postrotate reload.","Limit journald with a maximum size.","Free space safely: truncate an open log instead of deleting it."],["du -xh /var | sort -h | tail -15","logrotate -d /etc/logrotate.conf","journalctl --vacuum-size=500M","truncate -s 0 /var/log/app.log","/var/log/app/*.log {\n  daily\n  rotate 7\n  compress\n  copytruncate\n}"],"Rotation that the app ignores doesn’t free any space."],
["Linux","Senior","Too many open files","A busy service starts failing with EMFILE, “Too many open files”.","Compare actual usage with the real limit.",["Read the process limits from /proc, not from your shell’s ulimit.","Count the open descriptors for the process.","Services get limits from systemd: set LimitNOFILE in a drop-in.","Check the system-wide counter in file-nr.","Is it a leak? Many sockets in CLOSE_WAIT suggest the app is not closing connections."],["grep 'open files' /proc/<pid>/limits","ls /proc/<pid>/fd | wc -l","lsof -p <pid> | awk '{print $5}' | sort | uniq -c","systemctl edit myapp   # add LimitNOFILE=65536","cat /proc/sys/fs/file-nr"],"Raising the limit hides a leak. Check for one first."],
["Linux","Mid","Clock drift breaks TLS and logins","Users report certificate not yet valid errors and token failures on one server.","Check the time first.",["Compare the server time with a trusted source.","Is NTP running and synchronised? Check timedatectl and chrony.","Check the firewall allows outbound NTP (UDP 123).","On VMs, check guest time sync after a pause or migration.","Step the clock once, then keep chrony running."],["timedatectl","chronyc tracking","chronyc sources -v","chronyc makestep","systemctl enable --now chronyd"],"Many strange auth and TLS errors are just clock skew."],
["Linux","Mid","Can’t reach a server: network troubleshooting","You can’t connect to a service on another host. Where do you start?","Go layer by layer.",["Interface and IP address: is the link up and is there an address?","Routing: is there a default route and a gateway?","Ping the gateway, then the destination, to find where it stops.","Test the port directly, and trace the path with mtr.","Check the firewall rules on both ends."],["ip -br a","ip r","ping -c3 <gateway>","nc -zv <host> 443","mtr -rwc 10 <host>","nft list ruleset | head -40"],"Isolate the layer: link, route, name, port, firewall."],
["Linux","Mid","Names don’t resolve but IPs work","ping 1.1.1.1 works, but ping example.com fails on a server.","Separate DNS from connectivity.",["Confirm connectivity works with an IP and fails with a name.","Check the resolver configuration with resolvectl or /etc/resolv.conf.","Query a DNS server directly with dig and compare.","Check the hosts line in nsswitch.conf.","Flush the cache, restart the resolver and check the firewall for port 53."],["resolvectl status","dig example.com @1.1.1.1","getent hosts example.com","grep hosts /etc/nsswitch.conf","resolvectl flush-caches"],"If dig works against another resolver, the local config is wrong."],
["Linux","Senior","The server boots into emergency mode","After a reboot, the console shows “Welcome to emergency mode”.","A mount from fstab probably failed.",["Read the journal of this boot for the failed unit.","Typical cause: a wrong UUID or a missing disk in /etc/fstab.","Confirm real UUIDs with blkid.","Fix fstab. Use nofail for non-critical mounts.","Test with mount -a before the next reboot."],["journalctl -xb | grep -i failed","blkid","mount -o remount,rw /","UUID=<uuid> /data ext4 defaults,nofail 0 2","mount -a"],"Always run mount -a before rebooting after editing fstab."],
["Linux","Senior","The server is swapping and crawling","Latency is terrible and the host keeps using swap.","Heavy swap in and out means thrashing.",["vmstat: constant non-zero si and so columns confirm thrashing.","Find the biggest memory users and compare with RAM.","Is it a leak or simply an undersized host? Check trends and any cgroup limits.","Lower vm.swappiness for latency-sensitive services, add RAM or fix the leak.","Don’t just turn swap off on a busy host."],["vmstat 1 5","free -m","ps aux --sort=-%mem | head -5","swapon --show","sysctl -w vm.swappiness=10"],"Thrashing is a capacity or leak problem, not a tuning problem."],
["Linux","Senior","You suspect a server is compromised","Unknown outbound connections and an odd process appear on a production host.","Preserve evidence and isolate before you clean up.",["Don’t reboot or wipe. Isolate the host from the network, for example with a security group.","Check recent logins and the auth log.","Review running processes, listening ports and outbound connections.","Look for persistence: cron jobs, new users, SSH keys and systemd units.","Find recently changed files, rotate credentials, then rebuild from a clean image."],["last -a | head","grep Accepted /var/log/auth.log | tail","ss -tulpn","ps auxf","cat ~/.ssh/authorized_keys; ls /etc/cron.*","find / -xdev -type f -mtime -2 2>/dev/null | head"],"Isolate, investigate, then rebuild. Never trust a cleaned host."],
["Linux","Mid","Zombie processes keep piling up","ps shows hundreds of defunct processes and the PID count keeps rising.","A zombie is waiting for its parent.",["Zombies are finished children whose parent never collected their exit status.","Find the parent with the PPID column.","Killing a zombie does nothing. Fix or restart the parent so it reaps its children.","Check the app for a missing SIGCHLD or wait handling."],["ps -eo pid,ppid,stat,cmd | awk '$3 ~ /Z/'","ps -o pid,cmd -p <ppid>","systemctl restart myapp"],"You can’t kill a zombie. Fix its parent."],
["Linux","Senior","Locked out of sudo after a bad edit","Nobody can become root after someone edited /etc/sudoers by hand.","Get a root path that doesn’t need sudo.",["Prevent it next time: edit with visudo, which validates the syntax.","Try another admin, su, or the cloud serial console.","Otherwise boot to rescue mode, or attach the disk to another instance.","Fix the file and validate it with visudo -c."],["visudo -c","ls -l /etc/sudoers.d","mount /dev/xvdf1 /mnt && vi /mnt/etc/sudoers.d/admins"],"A broken sudoers file locks everyone out. Always use visudo."],
["Linux","Junior","apt fails with a dpkg lock error","apt install says it could not get the lock on /var/lib/dpkg/lock-frontend.","Another process may be using it.",["Find the process holding the lock. It is often unattended-upgrades.","Wait for it, or stop it properly. Don’t delete lock files while it runs.","If a run was interrupted, finish the configuration.","Then repair broken dependencies."],["ps aux | grep -E 'apt|dpkg'","fuser /var/lib/dpkg/lock-frontend","dpkg --configure -a","apt -f install"],"Find the owner of the lock before touching it."],
["Linux","Senior","Server won’t boot after a kernel update","The host hangs at boot after a kernel upgrade.","Boot the old kernel first.",["From the console, open GRUB advanced options and boot the previous kernel.","Read the failed boot’s journal for a missing initramfs or driver.","Rebuild the initramfs and the GRUB config.","Keep at least two kernels installed."],["uname -r","journalctl -b -1 -p err","update-initramfs -u -k all","grub2-mkconfig -o /boot/grub2/grub.cfg"],"Always keep a known-good kernel to fall back to."],
["Linux","Mid","Extend a full LVM volume without downtime","/data is 95% full and cannot be taken offline.","Grow the physical volume, then the logical volume and filesystem.",["Check free space in the volume group.","If there is none, enlarge the disk and run pvresize, or add a new disk to the group.","Extend the logical volume and the filesystem in one step.","For XFS use xfs_growfs. Verify with df."],["lsblk && df -h /data","vgs && lvs","pvresize /dev/xvdf","lvextend -r -L +50G /dev/vg0/data"],"LVM lets you grow storage online. Add -r to grow the filesystem too."],
["Linux","Senior","A software RAID array is degraded","Monitoring reports a degraded mdadm array after a disk failure.","Replace the failed member and watch the rebuild.",["Check /proc/mdstat to see which member failed.","Confirm details with mdadm --detail.","Mark the member failed, remove it, then add the new disk.","Avoid heavy I/O during the rebuild and check SMART on the other disks."],["cat /proc/mdstat","mdadm --detail /dev/md0","mdadm /dev/md0 --fail /dev/sdb1 --remove /dev/sdb1","mdadm /dev/md0 --add /dev/sdc1"],"A degraded array is working with no safety net. Rebuild now."],
["Linux","Senior","NFS mount hangs and load climbs","Any command that touches /mnt/share hangs, and load average keeps rising.","Processes are stuck waiting on the server.",["Hung processes in D state are waiting on NFS.","Check the server and exports from the client.","Review mount options: hard versus soft and timeouts.","Lazily unmount the dead mount and remount. Consider systemd automount."],["mount -t nfs4","showmount -e <server>","nfsstat -c","umount -f -l /mnt/share && mount -a"],"A hard NFS mount blocks forever when the server is gone."],
["Linux","Mid","SSH login takes 20 seconds","ssh connects, but the prompt appears after a long delay.","The delay is usually name lookups or GSSAPI.",["Use ssh -vvv to see where it pauses.","Reverse DNS (UseDNS) and GSSAPI authentication are the usual causes.","Disable them in sshd_config, validate and reload.","Also check slow PAM or motd scripts."],["ssh -vvv user@host 2>&1 | tail -20","UseDNS no\nGSSAPIAuthentication no","sshd -t && systemctl reload sshd","time ssh user@host true"],"Measure where the time goes before changing settings."],
["Linux","Mid","Thousands of failed SSH logins","The auth log shows constant password attempts from many IPs.","Reduce the exposure, not just the noise.",["Count failed attempts by source address.","Disable password login and root login. Use keys only.","Add fail2ban or rate limiting.","Restrict SSH with a security group, VPN or bastion."],["grep 'Failed password' /var/log/auth.log | awk '{print $(NF-3)}' | sort | uniq -c | sort -nr | head","PasswordAuthentication no\nPermitRootLogin no","fail2ban-client status sshd"],"Closing the door beats counting the knocks."],
["Linux","Mid","Works on localhost but not remotely","A service answers on 127.0.0.1 but other machines can’t connect.","Check the bind address, then each firewall layer.",["Is it listening on 0.0.0.0 or only on 127.0.0.1?","Check the host firewall: firewalld, ufw or nftables.","Check the cloud security group and network ACL.","Test from the client with nc."],["ss -ltnp | grep :8080","firewall-cmd --list-all","ufw status verbose","nc -zv <host> 8080"],"Bind address first, firewalls second."],
["Linux","Mid","kill -9 doesn’t stop the process","A process ignores even SIGKILL and stays in the process list.","Look at its state.",["State D (uninterruptible) ignores signals until the I/O completes.","State Z is already dead. Its parent must reap it.","For D, find what it waits on with wchan and the kernel stack.","Fix the cause (disk, NFS). A reboot is the last resort."],["ps -o pid,stat,wchan:32,cmd -p <pid>","cat /proc/<pid>/stack","lsof -p <pid>","dmesg -T | tail"],"Signals can’t interrupt a process blocked in the kernel."],
["Linux","Senior","A binary segfaults and the service restarts","The journal shows segfault and the service keeps restarting.","A core dump holds the answer.",["dmesg shows the faulting address and library.","Enable core dumps and collect one.","Open it in gdb and read the backtrace.","Check recent package or library changes with ldd."],["dmesg -T | grep -i segfault","coredumpctl list","coredumpctl gdb <pid>","ldd /usr/local/bin/app"],"A backtrace turns a mystery into a bug report."],
["Linux","Mid","systemd gives up restarting a service","The unit fails with “start request repeated too quickly”.","The real error is earlier in the log.",["Read the journal. The first failure shows the cause.","systemd stops after StartLimitBurst failures.","Fix the underlying error and add a RestartSec delay.","Reset the failed state and start again."],["journalctl -u myapp -n 50 --no-pager","systemctl show myapp -p NRestarts","systemctl reset-failed myapp","[Service]\nRestart=on-failure\nRestartSec=5"],"A restart loop hides the original error, so read the first failure."],
["Linux","Mid","A systemd timer never fires","A backup timer was created but nothing runs at 02:00.","Check the timer, not just the service.",["List timers: is it active and does it show a next run?","Enable and start the .timer unit, not only the .service.","Validate OnCalendar with systemd-analyze.","Use Persistent=true for missed runs and read the service logs."],["systemctl list-timers --all","systemd-analyze calendar '*-*-* 02:00:00'","systemctl enable --now backup.timer","journalctl -u backup.service"],"Enable the timer unit. The service alone won’t schedule itself."],
["Linux","Senior","Proxy fails with cannot assign requested address","Under load, outbound connections fail and thousands of sockets sit in TIME_WAIT.","You are running out of source ports.",["Count sockets by state.","Check the ephemeral port range.","Short-lived connections to one destination exhaust ports. Use keep-alive and connection pooling.","Widen the range, allow reuse for outgoing connections, or add source IPs."],["ss -s","ss -tan | awk '{print $1}' | sort | uniq -c","sysctl net.ipv4.ip_local_port_range","sysctl -w net.ipv4.tcp_tw_reuse=1"],"Reuse connections instead of tuning around exhaustion."],
["Linux","Mid","The TLS certificate expired on nginx","Browsers show a certificate expired warning on your site.","Check the date, then why renewal failed.",["Read the real expiry date with openssl.","Run certbot renew, or a dry run to see why it fails.","Common causes: port 80 blocked, DNS changed, a missing timer.","Reload nginx and add monitoring on days to expiry."],["echo | openssl s_client -connect <host>:443 -servername <host> 2>/dev/null | openssl x509 -noout -dates","certbot renew --dry-run","systemctl list-timers | grep certbot","nginx -t && systemctl reload nginx"],"Alert on certificate expiry well before it happens."],
["Linux","Mid","Remove a departed engineer’s access","A teammate left the company today. How do you remove their access from your servers?","Lock first, delete later.",["Lock and expire the account instead of deleting it.","Kill their sessions and processes.","Remove SSH keys, sudoers entries and cron jobs.","Find files they own and reassign them. Archive the home directory."],["usermod -L -e 1 <user>","pkill -KILL -u <user>","crontab -l -u <user>","find / -xdev -user <user> | head","grep -r <user> /etc/sudoers /etc/sudoers.d"],"Central identity (SSO or LDAP) makes offboarding one step."],
["Linux","Mid","A slow or incomplete rsync backup","The nightly rsync takes hours and you aren’t sure the copy is complete.","Dry-run and verify.",["Use a dry run to see exactly what would change.","Use -a, and --delete only when you mean it.","For slow links add --partial and a bandwidth limit.","Check the exit code, log the output and test a restore."],["rsync -avn --delete /data/ backup:/data/","rsync -a --partial --info=progress2 -e ssh /data/ backup:/data/","echo $?","rsync -a --checksum --dry-run /data/ backup:/data/"],"A backup you have never restored is only a guess."],
["Linux","Junior","free shows almost no free memory","free -m shows 200 MB free and someone wants to restart the server.","Linux uses spare RAM for cache.",["Page cache fills free memory and is released when needed.","Read the available column, not free.","Only constant swap in and out (si, so) signals real pressure.","Don’t drop caches as a fix. Track process memory over time to find leaks."],["free -m","vmstat 1 5","ps -eo pid,rss,cmd --sort=-rss | head","grep -E 'MemAvailable|^Cached' /proc/meminfo"],"Low free memory is normal. Low available memory is the problem."],
["Linux","Junior","umount fails: target is busy","umount /data says target is busy, and removing a directory says device busy.","Something has files open there.",["A process has a file open or its working directory on the mount.","Find it with fuser or lsof.","Stop those services or leave the directory in your shells.","Unmount. Use a lazy unmount only as a last resort."],["fuser -vm /data","lsof +D /data","systemctl stop myapp","umount /data"],"Find the holder before you force an unmount."],
["Linux","Senior","Debug a container that has no shell","A minimal container image has no shell or tools, and you need to inspect its network.","Enter its namespace from the host.",["Find the container’s PID on the host.","Enter its network namespace with nsenter and use the host’s tools.","Inspect sockets, routes and DNS from inside that namespace.","In Kubernetes, use an ephemeral debug container instead."],["docker inspect -f '{{.State.Pid}}' <container>","nsenter -t <pid> -n ss -tulpn","nsenter -t <pid> -n ip r","kubectl debug -it <pod> --image=nicolaka/netshoot --target=<container>"],"Namespaces let you bring your tools to the container."],
["Linux","Mid","SELinux blocks nginx after moving the web root","After moving the site to /data/www, nginx returns 403 although permissions are correct.","Check the SELinux context, don’t disable it.",["Check the mode and look for AVC denials in the audit log.","Compare file contexts. Web content needs the right type.","Set the context with semanage and apply it with restorecon.","Use audit2allow only after you understand the denial."],["getenforce","ausearch -m avc -ts recent","ls -Z /data/www","semanage fcontext -a -t httpd_sys_content_t '/data/www(/.*)?' && restorecon -Rv /data/www"],"Fix the label. Switching SELinux off is not a fix."],
["Linux","Mid","journald logs vanish after a reboot","After a restart, journalctl shows nothing from before the reboot.","Logs may only be stored in memory.",["Without /var/log/journal, journald can keep logs in volatile storage only.","Create the directory or set Storage=persistent.","Set size limits so logs don’t fill the disk.","Confirm with the list of boots."],["ls -d /var/log/journal","mkdir -p /var/log/journal && systemd-tmpfiles --create --prefix /var/log/journal","[Journal]\nStorage=persistent\nSystemMaxUse=1G","journalctl --list-boots"],"Persistent journals are what make postmortems possible."],
["Linux","Junior","A script keeps going after errors","A deploy script prints an error but continues and reports success.","Bash continues by default.",["Add set -euo pipefail at the top so errors stop the script.","pipefail catches a failure in the middle of a pipeline.","Use a trap to report the failing line and clean up.","Handle expected failures explicitly, and lint with shellcheck."],["#!/usr/bin/env bash\nset -euo pipefail\ntrap 'echo failed at line $LINENO' ERR","shellcheck deploy.sh","bash -x deploy.sh"],"Fail fast and loud instead of silently continuing."],
["Linux","Mid","A cleanup script deletes the wrong files","A script misbehaves only when filenames contain spaces.","Unquoted variables get split.",["Unquoted variables split on whitespace into several arguments.","Always quote variable expansions.","Use find with -print0 and xargs -0 for unusual names.","Dry-run with echo before any rm, and run shellcheck."],["rm -- \"$file\"","find . -name '*.log' -mtime +30 -print0 | xargs -0 echo rm","shellcheck cleanup.sh"],"Quote every expansion and dry-run destructive commands."],
["Linux","Mid","dnf can’t download repository metadata","dnf update fails with “Failed to download metadata for repo”.","Find out whether it is DNS, TLS, a 404 or a key.",["Read the exact error and the repo URL.","Test the URL with curl, including proxy settings.","Clean and rebuild the cache.","Check that the release isn’t end-of-life (repos move) and that the GPG key is imported."],["dnf repolist -v","curl -I <baseurl>/repodata/repomd.xml","dnf clean all && dnf makecache","rpm --import <key-url>"],"Test the repo URL by hand. It shows the real problem."],
["Linux","Senior","A busy API drops connections with idle CPU","Under load, clients see resets and timeouts, yet CPU is low.","Look at the listen queue.",["Check kernel counters for listen overflows and drops.","Compare the app’s backlog with somaxconn and tcp_max_syn_backlog.","Raise the sysctl values and the application backlog together.","Check that conntrack isn’t full, then load test."],["nstat -az TcpExtListenOverflows TcpExtListenDrops","ss -ltn","sysctl net.core.somaxconn net.ipv4.tcp_max_syn_backlog","sysctl -w net.core.somaxconn=4096","dmesg | grep conntrack"],"The kernel queue and the app backlog must both be big enough."],
["Linux","Senior","Find the hot code path with perf","A service is slow at 70% CPU and nobody knows which code is hot.","Sample, then look at the stacks.",["Record samples with a call graph for 30 seconds.","Read the report to find the hottest functions.","Turn it into a flame graph to see the full stacks.","Cross-check with a syscall summary, fix the hot path, measure again."],["perf record -F 99 -g -p <pid> -- sleep 30","perf report --stdio | head -40","perf script | stackcollapse-perf.pl | flamegraph.pl > flame.svg","strace -c -p <pid>"],"Measure before you optimise."],
["Linux","Mid","Database host has high disk latency","Queries are slow and iostat shows high await on the data disk.","Find who writes and what the volume allows.",["iostat -x shows await, utilisation and queue size.","Find the heavy process with pidstat -d or iotop.","Check mount options, the I/O scheduler and the cloud volume’s IOPS limits.","Benchmark a test file with fio, then upgrade the volume or reduce writes."],["iostat -xz 1 5","pidstat -d 1 5","cat /sys/block/nvme0n1/queue/scheduler","fio --name=t --rw=randread --bs=4k --size=1G --runtime=30 --filename=/data/fio.test"],"A volume at its IOPS cap looks exactly like a slow disk."],
["Linux","Mid","Works in my shell but not as a systemd service","A script runs fine by hand but fails when started by systemd.","Services get a minimal environment.",["systemd gives no login PATH, profile or shell variables.","Show the unit’s user, directory and environment.","Set Environment or EnvironmentFile, WorkingDirectory and User explicitly.","Reproduce the setup with systemd-run."],["systemctl show myapp -p Environment -p User -p WorkingDirectory","[Service]\nEnvironmentFile=/etc/myapp.env\nWorkingDirectory=/opt/myapp\nUser=myapp","systemd-run --uid=myapp --pty env","journalctl -u myapp -n 30"],"Never rely on your shell’s environment inside a unit."],
["Linux","Senior","High latency from CPU throttling in a container","A containerised service is slow, though the node’s CPU is mostly idle.","CPU limits throttle even on an idle node.",["A CPU limit throttles the container when it exceeds its quota in a period.","Read cpu.stat for the throttled period counts.","Compare the limit with real usage peaks.","Raise or remove the CPU limit and keep sensible requests."],["cat /sys/fs/cgroup/cpu.stat","cat /sys/fs/cgroup/cpu.max","kubectl top pod <pod>","rate(container_cpu_cfs_throttled_periods_total[5m])"],"Low node CPU doesn’t mean the container isn’t throttled."],
["Linux","Senior","A server rebooted by itself at 03:12","Nobody restarted a production server, but it rebooted overnight.","Read the last messages of the previous boot.",["Check the reboot history.","Read the end of the previous boot’s journal.","Look for an OOM storm, kernel panic, watchdog, hardware error or provider maintenance.","Check crash dumps and cloud events, then enable kdump and alerts."],["last -x reboot shutdown | head","journalctl -b -1 -n 50 --no-pager","ls /var/crash /var/lib/systemd/pstore","dmesg -T | grep -iE 'panic|mce|oom'"],"Persistent logs and kdump make surprise reboots explainable."]
